<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="PicLab Studio  offline design bench">
  <defs>
    <linearGradient id="well" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0e11"/>
      <stop offset="55%" stop-color="#12161b"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="safelight" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#34d3c0" stop-opacity="0.18"/>
      <stop offset="45%" stop-color="#34d3c0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#34d3c0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r="0.6" fill="#ffffff" opacity="0.035"/>
      <circle cx="4" cy="5" r="0.5" fill="#ffffff" opacity="0.025"/>
    </pattern>
    <clipPath id="frame">
      <rect x="48" y="56" width="380" height="308" rx="10"/>
    </clipPath>
  </defs>

  <!-- Plate -->
  <rect width="1280" height="420" fill="url(#well)"/>
  <rect width="1280" height="420" fill="url(#safelight)"/>
  <rect width="1280" height="420" fill="url(#grain)"/>

  <!-- Left: mock artboard -->
  <rect x="48" y="56" width="380" height="308" rx="10" fill="#1a2027" stroke="#2a333c" stroke-width="1.5"/>
  <g clip-path="url(#frame)">
    <rect x="48" y="56" width="380" height="308" fill="#c8b8a4"/>
    <rect x="48" y="56" width="380" height="168" fill="#2c353f"/>
    <rect x="72" y="248" width="180" height="14" rx="2" fill="#0b0e11" opacity="0.85"/>
    <rect x="72" y="272" width="120" height="8" rx="2" fill="#0b0e11" opacity="0.35"/>
    <rect x="72" y="292" width="88" height="28" rx="4" fill="#34d3c0"/>
  </g>
  <!-- Crop corners on artboard -->
  <path fill="none" stroke="#34d3c0" stroke-width="2.5" stroke-linecap="square"
    d="M64 92V72h20M392 72h20v20M412 328v20h-20M84 348H64v-20"/>

  <!-- Type block -->
  <text x="500" y="148" fill="#e8eef2" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="-1.5">PicLab Studio</text>
  <text x="502" y="188" fill="#34d3c0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3.5">OFFLINE DESIGN BENCH · DIGITAL DARKROOM</text>
  <text x="502" y="236" fill="#9aa7b2" font-family="Segoe UI, system-ui, sans-serif" font-size="20">Templates, projects, and library stay on your machine.</text>
  <text x="502" y="266" fill="#9aa7b2" font-family="Segoe UI, system-ui, sans-serif" font-size="20">No account. No cloud marketplace. Open the demo and work.</text>

  <!-- Spec chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#c5d0d8">
    <rect x="502" y="300" width="118" height="32" rx="6" fill="#1a2027" stroke="#2a333c"/>
    <text x="520" y="321">IndexedDB</text>
    <rect x="632" y="300" width="108" height="32" rx="6" fill="#1a2027" stroke="#2a333c"/>
    <text x="650" y="321">Canvas 2D</text>
    <rect x="752" y="300" width="88" height="32" rx="6" fill="#1a2027" stroke="#2a333c"/>
    <text x="770" y="321">MIT</text>
    <rect x="852" y="300" width="118" height="32" rx="6" fill="#1a2027" stroke="#2a333c"/>
    <text x="870" y="321">TypeScript</text>
  </g>

  <!-- Pixel mark (matches favicon language) -->
  <g transform="translate(1188,48)">
    <rect width="44" height="44" rx="10" fill="#12161b" stroke="#1e252c"/>
    <path fill="none" stroke="#34d3c0" stroke-width="2.2" stroke-linecap="square"
      d="M14 18V12h6M24 12h6v6M30 26v6h-6M18 32h-6v-6"/>
    <rect x="19" y="19" width="6" height="6" rx="0.8" fill="#34d3c0"/>
  </g>
</svg>
