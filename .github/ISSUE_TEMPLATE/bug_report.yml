---
name: Bug report
description: Something broken in Studio, Lab, or Pages
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill every section so we can reproduce.
        Questions / ideas → [Discussions](https://github.com/MarsResearcher/piclab/discussions).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did you run PicLab?
      options:
        - https://marsresearcher.github.io/piclab/
        - Local npm run dev
        - Other
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 128 / Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: UI badge or package.json (e.g. 0.1.22)
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Extra
      description: Screenshots, console errors, smoke output
    validations:
      required: false
